<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
</head>
<body>

    <form action="">

        <fieldset>

            <legend>Personal Information</legend>

            <table>

                <tr>
                    <td><label for="">User Name :</label></td>
                    <td><input type="text" name="" id="" placeholder="xyz"></td>
                </tr>

                <tr>
                    <td><label for="">Password :</label></td>
                    <td><input type="password" name="" id="" placeholder="abc@123"></td>
                </tr>

                <tr>
                    <td><label for="">Email :</label></td>
                    <td><input type="email" name="" id="" placeholder="xyz_123@gmail.com"></td>
                </tr>

                <tr>
                    <td><label for="">Age :</label></td>
                    <td><input type="number" name="" id=""></td>
                </tr>

                <tr>
                    <td><label for="">Contact :</label></td>
                    <td><input type="tel" name="" id=""></td>
                </tr>

                <tr>
                    <td><label for="">Date :</label></td>
                    <td><input type="date" name="" id=""></td>
                </tr>

                <tr>
                    <td><label for="">Time :</label></td>
                    <td><input type="time" name="" id=""></td>
                </tr>

                <tr>
                    <td><label for="">Exact Date and Time :</label></td>
                    <td><input type="datetime-local" name="" id=""></td>
                </tr>

            </table>

        </fieldset>


        <fieldset>

            <legend>Gender</legend>

            <table>

                <tr>
                    <td><input type="radio" name="Gender" id="Male" value="Male"></td>
                    <td><label for="Male">Male</label></td>
                </tr>

                <tr>
                    <td><input type="radio" name="Gender" id="Female" value="Female"></td>
                    <td><label for="Female">Female</label></td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>
</html>
