<body>

        </tr>

            <th colspan="2">WITHOUT PRACTICAL</th>
            <th colspan="2">WITH PRACTICAL</th>
        </tr>

            <td>3 * 1 = 3</td>
            <td>MCQ / ONE WORD / SENTENCE</td>
            <td>3 * 1 = 3</td>
        </tr>

        <tr>
            <td>VERY SHORT TYPE</td>
            <td>2 * 2 = 4</td>
            <td>VERY SHORT TYPE</td>
            <td>2 * 1 = 2</td>
        </tr>

        <tr>
            <td>SHORT TYPE</td>
            <td>5 * 1 = 5</td>
            <td>SHORT TYPE</td>
            <td>5 * 1 = 5</td>
        </tr>

        <tr>
            <td>LONG TYPE</td>
            <td>8 * 1 = 8</td>
            <td>LONG TYPE</td>
            <td>NA</td>
        </tr>

        <tr>
            <td>TOTAL</td>
            <td>20</td>
            <td>TOTAL</td>
            <td>10</td>
        </tr>

    </table>
